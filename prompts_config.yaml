# Prompts and Messages Configuration for CVCustomizer
# This file contains all system messages, prompts, and UI strings

# API Configuration
api:
  model: "gpt-3.5-turbo"
  temperature: 0.4
  max_tokens: 2000
  timeout: 30

# System Messages for LLM API calls
system_messages:
  summarize_experience: |
    Using my attached resume , write 5-7 sentences to summarize my professional experience, including only what’s relevant to the job description. Highlight my experience or skills that are relevant. Showcase how my experience and expertise can address the JD pain points. Write it using resume language (passive third person).
  
  customize_achievements: |
     I want you to rewrite each paragraph I give you as a resume bullet point, using similar language to what’s written in the job description.

# GPT-4 suitable prompts:
# system_messages:
#   summarize_experience: |
#     From resume → 5–7 sentence summary aligned to JD, highlighting relevant skills addressing pain points. Use passive third-person resume tone.
  
#   customize_achievements: |
#     For each resume paragraph: output one bullet point aligned to the provided job description, mirroring its language and focus.



# Prompts for LLM API calls
prompts:
  summarize_experience: |
    Job Description:
    {job_description}
    
    Resume:
    {experience_text}
  
  customize_achievements: |
    Job Description:
    {job_description}
    
    Company: {company_name}
    Job Title: {job_title}
    
    Original Achievements:
    {achievements_text}


  # Error and warning messages
messages:
  warnings:
    no_api_key: "Warning: No API key provided. Set LLM_API_KEY environment variable or pass api_key parameter."
    no_api_key_available: "Warning: No API key available. Returning original content."
    unexpected_api_response: "Warning: Unexpected API response format. Returning original content."
    api_call_failed: "Warning: API call failed: {error}. Returning original content."
  
  errors:
    file_not_found: "CV template file '{file}' not found."
    yaml_parse_error: "Error parsing YAML file: {error}"
    job_description_file_error: "Pls provide filename to the job desscription. Unable to open the file:{file}."
  
  success:
    cv_saved: "Customized CV saved to: {output_file}"
    cv_customization_completed: "CV customization completed successfully!"
    output_file: "Output file: {output_file}"



# Output file naming
output_settings:
  timestamp_format: "%Y%m%d_%H%M%S"
  file_extension: ".docx"

# HTTP headers
http_headers:
  authorization: "Authorization"
  content_type: "Content-Type"
  bearer_prefix: "Bearer {api_key}"
  application_json: "application/json"

# API response parsing
api_response:
  choices_key: "choices"
  message_key: "message"
  content_key: "content"
  min_choices_length: 1


